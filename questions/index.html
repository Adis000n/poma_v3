<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pytania - Poma</title>
    <style>
        body,
        html {
            height: 100%;
            width: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(90deg, #aa541b, #003366);
            background-size: 400% 400%;
            animation: gradient-animation 8s infinite;
            color: #444;
        }

        @keyframes gradient-animation {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        table {
            border: 6px solid rgba(0, 0, 0, 0.1);
            width: 80%;
            height: 80%;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            background: #f9f9f9;
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        td,
        th {
            padding: 20px;
            text-align: center;
            vertical-align: top;
        }

        td {
            background: #f5f5f5;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .Pytania h1 {
            font-size: 2.5rem;
            color: #007bff;
            margin-bottom: 20px;
        }

        .pytanko {
            position: relative;
            margin: 0 auto;
            margin-top: 10px;
        }

        #numer_druzyny,
        #punkty,
        #kategoria {
            font-size: 1.8rem;
            font-weight: bold;
            color: #007bff;
            margin-top: 10px;
        }

        #timer {
            font-size: 3rem;
            font-weight: bold;
            color: #dc3545;
            animation: pulse 1s infinite;
        }

        video,
        audio {
            width: 70%;
            height: auto;
            margin-top: 20px;
            max-width: 100%;
            max-height: 100%;
            border: 3px solid #007bff;
            border-radius: 10px;
        }

        #pytanie-img,
        #odpowiedz-img {
            width: 90%;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            margin: 10px auto;
            display: block;
            border-radius: 10px;
        }

        p {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }

        span {
            font-size: 1rem;
            color: #555;
        }

        #pytanie-loader {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: block;
            margin: 15px auto;
            position: relative;
            color: #ff9800;
            box-sizing: border-box;
            animation: animloader 0.7s linear infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                color: #ff3860;
            }

            50% {
                transform: scale(1.2);
                color: #ff6f91;
            }

            100% {
                transform: scale(1);
                color: #ff3860;
            }
        }

        @keyframes animloader {
            0% {
                box-shadow: -38px -12px, -14px 0, 14px 0, 38px 0;
            }

            33% {
                box-shadow: -38px 0px, -14px -12px, 14px 0, 38px 0;
            }

            66% {
                box-shadow: -38px 0px, -14px 0, 14px -12px, 38px 0;
            }

            100% {
                box-shadow: -38px 0, -14px 0, 14px 0, 38px -12px;
            }
        }

        @keyframes fade-in {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slide-in {
            from {
                transform: translateY(-40px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .fade-in {
            animation: fade-in 1s forwards;
        }

        .slide-in {
            animation: slide-in 0.5s forwards;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .overlay-content {
            width: 1100px;
            height: 300px;
            font-size: 50px;
            background-color: white;
            color: black;
            font-weight: bold;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .overlay-content1 {
            width: 50%;
            height: 20%;
            font-size: 60px;
            font-weight: bold;
            color: black;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .overlay-background {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 30%;
            height: 28%;
            font-size: 50px;
            background-color: white;
            color: black;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            background-position: center;
            background-repeat: no-repeat;
            background-size: 50%;
            background-image: url('./kolo.png');
        }
        #end-message-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            /* Only transition opacity when hiding */
            transition: opacity 0.3s ease-out;
        }

        #end-message {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            display: block;
            transform: scale(1);
            /* Only transition transform when hiding */
            transition: transform 0.3s ease-out;
        }
    </style>
    <link href="../bootstrap/bootstrap.css" rel="stylesheet" type="text/css" />
    <script>
        // Trzeba wysyłać wartości true / false (true - pokarze, false - zamknie)
        function showBoostersWheele(){
            const overlay = document.getElementById('overlay');
            overlay.innerHTML = `<div class="overlay-background"><div class="overlay-content1">Losowanie<br>Bonusu</div></div>`;
            toggleOverlay(true)
        }
        function toggleOverlay(show) {
            const overlay = document.getElementById('overlay');
            overlay.style.display = show ? 'flex' : 'none';
        }
        // Trzeba wysyłać druzynę (Numer drużyny), booster który został wylosowany
        function pokazBooster(booster) {
            const overlay = document.getElementById('overlay');
            overlay.innerHTML = `<div class="overlay-content">Otrzymano bonus:<br> ${booster} <br>`;
            setTimeout(function(){
                toggleOverlay(false);
            }, 5000);
        }
    </script>
</head>
<body>
    <div id="overlay"></div>
    <div id="end-message-container">
        <img id="end-message" src="../grafika/koniec-czasu.png">
    </div>
    <table>
        <tr>
            <td rowspan="4">
                <div class="Pytania">
                    <h1 class="pytanko"> Pytanie: </h1>
                    <img id="pytanie-img"><br>
                    <span id="pytanie-loader"></span>
                    <video id="wideo">
                        <source src="" type="video/mp4">
                        Coś poszło nie tak lub twoja przeglądarka nie wspiera wyswietlania filmów.
                    </video>
                    <audio id="audio">
                        <source src="" type="audio/mpeg">
                        Coś poszło nie tak lub twoja przeglądarka nie wspiera wyswietlania filmów.
                    </audio>
                    <img id="odpowiedz-img">
                </div>
            </td>
            <td style="border: 4mm ridge rgba(255, 166, 0, 0.747); width: 20%;">
                <p> Numer Drużyny: </p>
                <div id="numer_druzyny">-</div>
            </td>
        </tr>
        <tr>
            <td style="border: 4mm ridge rgba(255, 166, 0, 0.747);">
                <p>Pytanie za: </p>
                <div id="punkty">-</div>
            </td>
        </tr>
        <tr>
            <td style="border: 4mm ridge rgba(255, 166, 0, 0.747);">
                <p>Kategoria: </p>
                <div id="kategoria">-</div>
            </td>
        </tr>
        <tr>
            <td style="border: 4mm ridge rgba(255, 166, 0, 0.747);">
                <p>Pozostały czas: </p>
                <div id="timer">30</div>
            </td>
        </tr>
    </table>
    <script src="ws_setup.js"></script>
    <script src="js/audio_status.js"></script>
    <script src="js/main.js"></script>
    <script src="js/timer_script.js"></script>
    <script src="js/wys_pytania.js"></script>
    <script src="js/wys_odpowiedzi.js"></script>
    <script src="js/czyszczenie.js"></script>
    <script src="js/media.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/custom_pytanie.js"></script>
    <script src="js/powieksz_pomniejsz.js"></script>

</body>

</html>
