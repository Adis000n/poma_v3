<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pytania - Poma</title>
    <style>
        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(rgb(75, 75, 204), rgb(53, 53, 104));
        }

        table {
            border: 4mm ridge rgba(255, 166, 0, 0.747);
            width: 80%;
            height: 80%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        td, th {
            border: 4mm ridge rgba(255, 166, 0, 0.747);
            padding: 15px;
            text-align: center;
        }

        td {
            background-color: #f9f9f9;
        }

        .pytanko {
            width: 100%;
            height: 50%;
        }

        #Pyanie {
            width: 100%;
            height: 100%;
        }
        .Pytania {
            height: 100%;
        }

        #pytanie-loader {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: block;
            margin:15px auto;
            position: relative;
            color: #fb8500;
            box-sizing: border-box;
            animation: animloader 0.7s linear infinite alternate;
          }
          
          @keyframes animloader {
            0% {
              box-shadow: -38px -12px ,  -14px 0,  14px 0, 38px 0;
            }
            33% {
              box-shadow: -38px 0px, -14px -12px,  14px 0, 38px 0;
            }
            66% {
              box-shadow: -38px 0px , -14px 0, 14px -12px, 38px 0;
            }
            100% {
              box-shadow: -38px 0 , -14px 0, 14px 0 , 38px -12px;
            }
          }
          

    </style>
    <link href="../bootstrap/bootstrap.css" rel="stylesheet" type="text/css"/> 
</head>
<body>
    <table>
        <tr>
            <td rowspan="4">
            <div class="Pytania">
                <h1 class="pytanko"> Pytanie: </h1>
                <img id="pytanie-img"><br>
                <span id="pytanie-loader"></span>
                <video id="wideo">
                    <source src="" type="video/mp4" >
                    Coś poszło nie tak lub twoja przeglądarka nie wspiera wyswietlania filmów.
                </video>
                <audio id="audio">
                    <source src="" type="audio/mpeg" >
                    Coś poszło nie tak lub twoja przeglądarka nie wspiera wyswietlania filmów.
                </audio>
                <img id="odpowiedz-img">
            </div>
            </td>
            <td style="border: 4mm ridge rgba(255, 166, 0, 0.747); width: 20%;"><p> Numer Drużyny: </p>
            <div id="numer_druzyny">-</div></td>
        </tr>
        <tr>
            <td style="border: 4mm ridge rgba(255, 166, 0, 0.747);">
                <p>Pytanie za: </p>
                <div id="punkty">-</div>
            </td>
        </tr>
        <tr>
            <td style="border: 4mm ridge rgba(255, 166, 0, 0.747);">
                <p>Kategoria: </p>
                <div id="kategoria">-</div>
            </td>
        </tr>
        <tr>
            <td style="border: 4mm ridge rgba(255, 166, 0, 0.747);">
                <p>Pozostały czas: </p>
                <div id="timer">30</div>
            </td>
        </tr>
    </table>
    <script src="../ws_setup.js"></script>
    <script src="js/main.js"></script>
    <script src="js/timer_script.js"></script>
    <script src="js/wys_pytania.js"></script>
    <script src="js/wys_odpowiedzi.js"></script>
    <script src="js/czyszczenie.js"></script>
    <script src="js/media.js"></script>
</body>
</html>
