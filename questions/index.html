<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pytania - Poma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stylepytania.css" type="text/css">
    <link href="../bootstrap/bootstrap.css" rel="stylesheet" type="text/css" />
    <script>
       
    </script>
</head>

<body>
    <div id="overlay"></div>
    <div id="end-message-container">
        <img id="end-message" src="../grafika/koniec-czasu.png">
    </div>
    <table>
        <tr>
            <td rowspan="4">
                <div class="Pytania">
                    <h1 class="pytanko"> Pytanie: </h1>
                    <img id="pytanie-img">
                    <span id="pytanie-loader"></span>
                    <video id="wideo">
                        <source src="" type="video/mp4">
                        Coś poszło nie tak lub twoja przeglądarka nie wspiera wyswietlania filmów.
                    </video>
                    <audio id="audio" >
                        <source src="" type="audio/mpeg">
                        Coś poszło nie tak lub twoja przeglądarka nie wspiera wyswietlania filmów.
                    </audio>
                    <img id="odpowiedz-img">
                </div>
            </td>
            <td id="numerek">
                <p> Numer Drużyny: </p>
                <div id="numer_druzyny">-</div>
            </td>
        </tr>
        <tr>
            <td>
                <p>Pytanie za: </p>
                <div id="punkty">-</div>
            </td>
        </tr>
        <tr>
            <td>
                <p>Kategoria: </p>
                <div id="kategoria">-</div>
            </td>
        </tr>
        <tr>
            <td>
                <p>Pozostały czas: </p>
                <div id="timer">30</div>
            </td>
        </tr>
    </table>
    <script src="js/kolo.js"></script>
    <script src="ws_setup.js"></script>
    <script src="js/audio_status.js"></script>
    <script src="js/main.js"></script>
    <script src="js/timer_script.js"></script>
    <script src="js/wys_pytania.js"></script>
    <script src="js/wys_odpowiedzi.js"></script>
    <script src="js/czyszczenie.js"></script>
    <script src="js/media.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/custom_pytanie.js"></script>
    <script src="js/powieksz_pomniejsz.js"></script>
    <script src="js/wygrana.js"></script>
</body>

</html>
