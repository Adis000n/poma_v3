<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plansza - Poma</title>
    <script src="ws_setup.js"></script>
    <script src="js/main.js"></script>
    <script src="js/wyswietl_punkty_na_planszy.js"></script>
    <script src="js/wyswietl_nazwy_szkol.js"></script>
    <script src="js/ustawienie_pionkow_rozpoczecie_konkursu.js"></script>
    <script src="js/ustawianie_pionkow.js"></script>
    <style> 
    body, html { 
        overflow-y: hidden; 
        overflow-x: hidden; 
}
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
           /* overflow: ?; */
            
        }

        .Plansza {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 2fr 1fr;
            width: 110%;
            height: 110%;
        }

/* ZESPOLY _--------------------------------------------------------------------------------------------------------------------------------------------------------------- */
        .team1{
            position: absolute;
    left: 0;
    top: 0;
    right: auto;
    bottom: auto;
    font-size: 45px;
    

        }

        .team2{
            text-align: right;
    position: absolute;
    left: auto;
    top: 0;
    right: 0;
    bottom: auto;
    font-size: 45px;
        }
        .team3{
            position: absolute;
    left: 0;
    top: auto;
    right: auto;
    bottom: 0;
    font-size: 45px;
        }
        .team4{
            text-align: right;
    position: absolute;
    left: auto;
    top: auto;
    right: 0;
    bottom: 0;
    font-size: 45px;

        }
        .team1 { grid-column: 1; grid-row: 1; }
        .team2 { grid-column: 3; grid-row: 1; }
        .team3 { grid-column: 1; grid-row: 3; }
        
        .team4 {
            grid-column: 3;  
            grid-row: 3;   
        }
        .team4, .team3 {
            padding-bottom: 45px;
        }
        #nazwa_druzny1 , #nazwa_druzny2 , #nazwa_druzny3 , #nazwa_druzny4 {
            max-width: 420px; 
    word-wrap: break-word; 
    white-space: normal; 
        }
/* _--------------------------------------------------------------------------------------------------------------------------------------------------------------- */


        .board img {
            width:200%;
            height: 100vh;
            object-fit: cover;
        }

        #nazwa_druzny1 {
            margin-bottom: 10px;
            font-family: "Arial";
            color:aqua
        }
        #nazwa_druzny2 {
            margin-bottom: 10px;
            font-family: "Arial";
            color: rgb(249 128 128)
        }
        #nazwa_druzny3 {
            margin-bottom: 10px;
            font-family: "Arial";
            color:yellow
        }
        #nazwa_druzny4 {
            margin-bottom: 10px;
            font-family: "Arial";
            color:rgb(122 235 107)
        }
          /* PUNKTY CZCIONKOA*/
        #points1 {
            color:aqua
        }
        #points2 {
            color: rgb(249 128 128)
        }
        #points3{ 
            color:yellow
        }
        #points4{
            color:rgb(122 235 107)
        }
    /* _--------------------------------------------------------------------------------------------------------------------------------------------------------------- */
 /* css kuby do wywalenia potem */
 .pawn {
    width: 8px;
    height: 8px;
    top: 0;
    left: 0;
    border-radius: 50%;
    position: absolute;
    align-items: center;
    box-shadow: none;
    transition: 0.7s ease-in-out;
    scale: 0.25;
}
#board {
    width: 1000px;
    height: 1000px;
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    margin: auto;
}
    </style>
</head>
<body>

    <div class="Plansza">
        <div class="team1">
            <div>Drużyna 1:</div>
            <div id="nazwa_druzny1">-</div>
            Punkty: 
            <div id="points1">-</div>
        </div>

        <div class="board">
            <img id="board" src="plansza.png" alt="Plansza gry">
        </div>
        <div class="pawn" id="pawn1"><img src="../grafika/pawn4.png" alt="BRAKUJE ZDJĘĆ" hidden ></div>  
        <div class="pawn" id="pawn2"><img src="../grafika/pawn4.png" alt="BRAKUJE ZDJĘĆ" hidden></div>  
        <div class="pawn" id="pawn3"><img src="../grafika/pawn4.png" alt="BRAKUJE ZDJĘĆ" hidden></div>  
        <div class="pawn" id="pawn4"><img src="../grafika/pawn4.png" alt="BRAKUJE ZDJĘĆ" hidden></div>  

      

        <div class="team2">
            <div>Drużyna 2:</div>
            <div id="nazwa_druzny2">-</div> 
            Punkty:
            <div id="points2">-</div>
        </div>

        <div class="team3">
            <div>Drużyna 3:</div>
            <div id="nazwa_druzny3">-</div>
            Punkty:
            <div id="points3">-</div>
        </div>

        <div class="team4">
            <div>Drużyna 4:</div>
            <div id="nazwa_druzny4">-</div>
            Punkty:
            <div id="points4">-</div>
        </div>
    </div>
    <div id="boost1" style="display: none;">0</div>
    <div id="boost2" style="display: none;">0</div>
    <div id="boost3" style="display: none;">0</div>
    <div id="boost4" style="display: none;">0</div>
</body>
</html>
