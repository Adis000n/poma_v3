<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plansza - Poma</title>
    <script src="../ws_setup.js"></script>
    <script src="js/main.js"></script>
    <script src="js/wyswietl_punkty_na_planszy.js"></script>
    <script src="js/wyswietl_nazwy_szkol.js"></script>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden
            
        }

        .Plansza {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 2fr 1fr;
            width: 110%;
            height: 110%;
        }
/* ZESPOLY _--------------------------------------------------------------------------------------------------------------------------------------------------------------- */
        .team1{
            position: absolute;
    left: 0;
    top: 0;
    right: auto;
    bottom: auto;
    font-size: 45px;
    

        }

        .team2{
            text-align: right;
    position: absolute;
    left: auto;
    top: 0;
    right: 0;
    bottom: auto;
    font-size: 45px;
        }
        .team3{
            position: absolute;
    left: 0;
    top: auto;
    right: auto;
    bottom: 0;
    font-size: 45px;
        }
        .team4{
            text-align: right;
    position: absolute;
    left: auto;
    top: auto;
    right: 0;
    bottom: 0;
    font-size: 45px;

        }
        .team1 { grid-column: 1; grid-row: 1; }
        .team2 { grid-column: 3; grid-row: 1; }
        .team3 { grid-column: 1; grid-row: 3; }
        
        .team4 {
            grid-column: 3;  
            grid-row: 3;   
        }
        .team4, .team3 {
            padding-bottom: 45px;
        }
        .nazwa_druzny1 , .nazwa_druzny2 , .nazwa_druzny3 , .nazwa_druzny4 {
            max-width: 420px; 
    word-wrap: break-word; 
    white-space: normal; 
        }
/* _--------------------------------------------------------------------------------------------------------------------------------------------------------------- */
        .board {
            display: flex;
            justify-content: center;
            align-items: center;
            grid-column: 2;
            grid-row: 2;
        }

        .board img {
            width:200%;
            height: 100vh;
            object-fit: cover;
        }

        #nazwa_druzny1 {
            margin-bottom: 10px;
            font-family: "Brush Script MT", cursive;
            color:aqua
        }
        #nazwa_druzny2 {
            margin-bottom: 10px;
            font-family: "Brush Script MT", cursive;
            color: rgb(249 128 128)
        }
        #nazwa_druzny3 {
            margin-bottom: 10px;
            font-family: "Brush Script MT", cursive;
            color:yellow
        }
        #nazwa_druzny4 {
            margin-bottom: 10px;
            font-family: "Brush Script MT", cursive;
            color:rgb(122 235 107)
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .overlay-content {
            width: 1100px;
            height: 300px;
            font-size: 50px;
            background-color: white;
            color: black;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>
     <script>
        // Trzeba wysyłać wartości true / false (true - pokarze, false - zamknie)
        function toggleOverlay(show) {
            const overlay = document.getElementById('overlay');
            overlay.style.display = show ? 'flex' : 'none';
        }
        // Trzeba wysyłać druzynę (Numer drużyny), booster który został wylosowany
        function pokazBooster(team, booster) {
            const overlay = document.getElementById('overlay');
            overlay.innerHTML = `<div class="overlay-content">${team} otrzymała bonus:<br> ${booster} <br>`;
            toggleOverlay(true);
        }
    </script>
</head>
<body>
    <div id="overlay"></div>

    <div class="Plansza">
        <div class="team1">
            <div>Drużyna 1</div>
            <div id="nazwa_druzny1">Szkola Podstawowa Numer 27 W Bielsku-Białej</div>
            <div id="points1">PKT: -</div>
        </div>

        <div class="board">
            <img src="../grafika/plansza.png" alt="Plansza gry">
        </div>

        <div class="team2">
            <div>Drużyna 2</div>
            <div id="nazwa_druzny2">T</div> 
            <div id="points2">PKT: -</div>
        </div>

        <div class="team3">
            <div>Drużyna 3</div>
            <div id="nazwa_druzny3">T</div>
            <div id="points3">PKT: -</div>
        </div>

        <div class="team4">
            <div>Drużyna 4</div>
            <div id="nazwa_druzny4">T</div>
            <div id="points4">PKT: -</div>
        </div>
    </div>

    <!-- Przycisk do debugowania -->
    <!-- <button onclick="pokazBooster('Drużyna 1', 'dodatkowy rzut kostką')" style="position: fixed; bottom: 60px; right: 10px;">Pokaż bonus dla Drużyny 1</button> -->
</body>
</html>
