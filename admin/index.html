<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Poma</title>
    <link href="../bootstrap/bootstrap.css" rel="stylesheet" type="text/css"/> 
    
</head>
<body>
    <h1>Admin</h1>
    <div id="Dodaj_druzyny">
        <h2>Obsługa konkurus</h2>
        <button type="button" class="btn btn-success" onclick="startevent()">Rozpocznij konkurs</button><br>
        <br>
    </div>
    <div id="timer">
        <button type="button" class="btn btn-success" id="start_btn">Start</button>
        <button type="button" class="btn btn-danger" id="stop_btn">Stop</button>
        <button type="button" class="btn btn-warning" id="reset_btn">Reset</button>
    </div>
    

    <div id="pytania" >
        <h3>Kategoria:</h3>
        <div class="btn-group btn-group-toggle" role="group" aria-label="Kategoria buttons">
            <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'kategoria')" value="chemia">Chemia</button>
            <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'kategoria')" value="informatyka">Informatyka</button>
            <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'kategoria')" value="fizyka">Fizyka</button>
            <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'kategoria')" value="matematyka">Matematyka</button>
            <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'kategoria')" value="technika">Technika</button>
            <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'kategoria')" value="niespodzianka">Niespodzianka</button>
            <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'kategoria')" value="bonus">Bonus</button>
        </div>

        <h3 class="mt-4">Punkty:</h3>
        <div class="btn-group btn-group-toggle" role="group" aria-label="Punkty buttons">
            <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'punkty')" value="1">1</button>
            <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'punkty')" value="2">2</button>
            <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'punkty')" value="3">3</button>
        </div>

        <h3 class="mt-4">Numer Drużyny:</h3>
        <div class="btn-group btn-group-toggle" role="group" aria-label="Numer Drużyny buttons">
            <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'numerDruzyny')" value="1">1</button>
            <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'numerDruzyny')" value="2">2</button>
            <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'numerDruzyny')" value="3">3</button>
            <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'numerDruzyny')" value="4">4</button>
        </div>
        <div class="mt-4" id="pytanie_all_buttons">
        <!-- Przyciski są tworzone w odpowiednich momentach skryptu funkcje które tworzą przyciski są w main.js -->
         
        
        <!-- Nowa sekcja do ręcznego zmieniania punktów -->
         <div id="manual_points_change">
            <h3>Ręczna zmiana punktów:</h3>
            <div class="form-group">
                <label for="team_select">Wybierz drużynę:</label>
                <select class="form-control" id="team_select">
                    <option value="1">Drużyna 1</option>
                    <option value="2">Drużyna 2</option>
                    <option value="3">Drużyna 3</option>
                    <option value="4">Drużyna 4</option>
                </select>
            </div>
            <div class="form-group mt-2">
                <label for="team_points">Wprowadź punkty:</label>
                <input type="number" class="form-control" id="team_points" placeholder="Wprowadź punkty">
            </div>
            <button type="button" class="btn btn-primary mt-2" onclick="manualChangePoints()">Zapisz zmiany</button>
        <!----------------------------------------------------------------------------------------------------------------->
        
        </div>
        </div>
        <div id="show_all_time_buttons">
            <button id="mediaButton" type="button" class="btn btn-dark" onclick="start_stop_media()">Start/stop Media</button>
            <button id="clearButton" type="button" class="btn btn-info" onclick="clear_pytania()">Wyczyść pytania</button>
         </div>
    </div>
    <script src="../ws_setup.js"></script>
    <script src="js/main.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/pytanie.js"></script>
    <script src="js/odpowiedz.js"></script>
    <script src="js/druzyny.js"></script>
    <script src="js/punkty.js"></script>
    <script src="js/wrong_or_correct.js"></script>
    <script src="js/czysczenie_pytan.js"></script>
    <script src="js/media.js"></script>
</body>
</html>
