<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Poma</title>
    <link rel="stylesheet" href="style.css">
    <script src="../sweetalert/sweetalert2.all.min.js"></script>
</head>
<body>
    <div id="grid">
        <div id="lewy">
            <div id="teams" class="teams-table">
        
            </div>
            <div id="gridlewy">
                <div id="timerall">
                    <h2>Timer</h2>
                    <div id="timer">
                        <button type="button" class="btn btn-success" id="start_btn">▶️</button>
                        <button type="button" class="btn btn-danger" id="stop_btn">⏹️</button>
                        <button type="button" class="btn btn-add" id="add_btn">➕</button>
                        <button type="button" class="btn btn-warning" id="reset_btn">🔄</button>
                        <p id="time">30</p>
                    </div>
                </div>
                <div id="Dodaj_druzyny">
                    <h2>Obsługa konkursu</h2>
                    <button type="button" class="btn btn-success" onclick="startevent()">Rozpocznij konkurs</button><br>
                    <br>
                    <div class="pushable" type="button" class="btn btn-warning" id="backup_btn">
                        <span class="front">
                          BACKUP
                        </span>
                      </div>
                    <br>
                    <br>
                    <button type="button" class="btn btn-dark" id="settings_btn">USTAWIENIA</button>
                </div>
            </div>
        </div>
        
        <div id="prawy">
            <div id="pytania" >
                <h3>Kategoria:</h3>
                <div class="btn-group btn-group-toggle" role="group" aria-label="Kategoria buttons">
                    <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'kategoria')" value="chemia">Chemia</button>
                    <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'kategoria')" value="informatyka">Informatyka</button>
                    <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'kategoria')" value="fizyka">Fizyka</button>
                    <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'kategoria')" value="matematyka">Matematyka</button>
                    <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'kategoria')" value="technika">Technika</button>
                    <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'kategoria')" value="niespodzianka">Niespodzianka</button>
                    <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'kategoria')" value="bonus">Bonus</button>
                </div>
                <h3 class="mt-4">Punkty:</h3>
                <div class="btn-group btn-group-toggle" role="group" aria-label="Punkty buttons">
                    <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'punkty')" value="1">1</button>
                    <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'punkty')" value="2">2</button>
                    <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'punkty')" value="3">3</button>
                </div>
                <h3 class="mt-4">Numer Drużyny:</h3>
                <div class="btn-group btn-group-toggle" role="group" aria-label="Numer Druzyny buttons">
                    <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'numerDruzyny')" value="1">1</button>
                    <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'numerDruzyny')" value="2">2</button>
                    <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'numerDruzyny')" value="3" id="team3">3</button>
                    <button type="button" class="btn btn-outline-primary" onclick="selectOption(this, 'numerDruzyny')" value="4" id="team4">4</button>
                </div>
                <div class="mt-4" id="pytanie_all_buttons">
                </div>
                </div>
                <div id="show_all_time_buttons">
                    <button id="mediaButton" type="button" class="btn btn-dark play" onclick="start_stop_media()">Play Media ▶️</button>
                    <button id="clearButton" type="button" class="btn btn-info" onclick="clear_pytania()">Wyczyść pytania</button>
                </div>
                <div id="status-dot-container">
                    <div id="status-dot" class="inactive"></div> Status czy dzwięki z pytań będą odtworzone poprawnie
                </div>
            </div>
        </div>
    </div>
    <div id="settings">
        <div>
            <h2>Ustawienia</h2>
            <div class="settings-group">
                <label for="path-input">Ścieżka do POMA:</label>
                <input type="text" id="path-input" class="settings-input">
            </div>
            <div class="settings-group">
                <label for="sweetalert-toggle">Ładniejsze to do wrpowadzania przy rozpoczynaniu konkursu:</label>
                <input type="checkbox" id="sweetalert-toggle" class="settings-toggle">
            </div>
            <div class="settings-group">
                <label for="teams-toggle">Wyłącz przciski drużyn które nie grają:</label>
                <input type="checkbox" id="teams-toggle" class="settings-toggle">
            </div>
            <div class="settings-buttons">
                <button class="btn btn-warning" id="reset-settings">Reset do domyślnych</button>
                <button class="btn btn-danger" id="close-settings">Zamknij</button>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="js/setup_variables.js"></script>
    <script type="text/javascript" src="js/settings.js"></script>
    <script  type="text/javascript" src="../ws_setup.js"></script>
    <script type="text/javascript" src="js/main.js"></script>
    <script type="text/javascript" src="js/punkty.js"></script>
    <script type="text/javascript" src="js/backup.js"></script>
    <script type="text/javascript" src="js/audio_status.js"></script>
    <script type="text/javascript" src="js/timer.js"></script>
    <script type="text/javascript" src="js/pytanie.js"></script>
    <script type="text/javascript" src="js/odpowiedz.js"></script>
    <script type="text/javascript" src="js/druzyny.js"></script>
    <script type="text/javascript" src="js/wrong_or_correct.js"></script>
    <script type="text/javascript" src="js/czysczenie_pytan.js"></script>
    <script type="text/javascript" src="js/media.js"></script>
</body>
</html>
